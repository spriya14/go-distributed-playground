apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app-deployment
  name: app-deployment
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-deployment
  strategy: {}
  template:
    metadata:
      labels:
        app: app-deployment
    spec:
      containers:
      - image: nginx:1.19
        name: nginx
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
status: {}
